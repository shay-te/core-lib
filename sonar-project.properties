# SonarQube / SonarCloud project configuration.
#
# Local scan against SonarCloud (no Docker, no Java, no local server):
#   brew install sonar-scanner    # or: pip install pysonar
#   export SONAR_TOKEN=<token-from-sonarcloud.io/account/security>
#   scripts/run_sonar_local.sh
#
# Faster local pre-commit lint (no server at all, covers most Sonar rules):
#   pip install ruff
#   ruff check core_lib tests

sonar.projectKey=shay-te_core-lib
sonar.organization=shay-te
sonar.projectName=core-lib
sonar.projectVersion=1.0

sonar.sources=core_lib
sonar.tests=tests

# Python interpreter (helps sonar resolve types correctly)
sonar.python.version=3.9

# Coverage report — generated by `pytest --cov=core_lib --cov-report=xml`
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/test_data/**
sonar.coverage.exclusions=tests/**,**/test_*.py

# Encoding
sonar.sourceEncoding=UTF-8
