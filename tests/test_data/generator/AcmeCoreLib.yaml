core_lib:
  name: AcmeCoreLib
  env:
    ACME_REGION: local
  connections:
    - key: acme_db
      migrate: false
      config_instantiate: true
      type: core_lib.connection.sql_alchemy_connection_factory.SqlAlchemyConnectionFactory
      config:
        create_db: true
        log_queries: false
        url:
          protocol: sqlite
  caches:
    - key: acme_cache
      type: memory
  jobs:
    - key: cleanup_widgets
      initial_delay: 1h
      frequency: 24h
      handler:
        _target_: acme_core_lib.jobs.cleanup_widgets.CleanupWidgets
  entities:
    - key: widget
      connection: acme_db
      columns:
        - key: name
          type: VARCHAR
          default: null
      is_soft_delete: true
      is_soft_delete_token: false
  data_accesses:
    - key: WidgetDataAccess
      functions:
        - key: get_by_name
      is_crud: true
      is_crud_soft_delete: true
      is_crud_soft_delete_token: false
      connection: acme_db
      entity: widget
  services:
    - key: WidgetService
      functions:
        - key: get_by_name
          result_to_dict: true
          cache_key: CACHE_WIDGET
          cache_invalidate: false
      data_access: WidgetDataAccess
  setup:
    author: acme
    author_email: dev@acme.example
    description: Widgets for acme
    url: ""
    license: MIT
    classifiers:
      - "Development Status :: 3 - Alpha"
    version: 0.0.0.1
